<body class="p-3 mb-2">

<h1>New Game</h1>

        <h2>Players</h2>
        <ul class="list-group py-2">
            <li class="list-group-item py-2">Item 1</li>
            <li class="list-group-item">Item 2</li>
        </ul>
    <div class="input-group mb-3">

    </div>
